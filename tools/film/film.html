  var l = document.createElement('div'); var L1 = ' left', R1 = ' right';
  var side = { b2: L1, b1: L1, rdc: L1, r1: L1, dec: R1, h: R1 }[k] || '';
  l.className = 'lbl' + (k === 'h' || k === 'dec' ? ' gold' : '') + side; l.textContent = D.L[k];
  $('labels').appendChild(l); labelEls[k] = l;
});
// légende du panneau
var LEG = ['plot', 'b2', 'dec', 'rdc', 'r1', 'h', 'floor'];
$('legend').innerHTML = LEG.map(function (k) { return '<li>' + D.L[k] + '</li>'; }).join('');

/* ---------- rendu d'une image ---------- */
var img = $('frame'), lastSrc = '';
function setFrame(sec) {
  var n = clamp(Math.round(sec * FPS_SRC) + 1, 1, Math.round(15.04 * FPS_SRC));
  var src = 'file://' + FR + '/f' + String(n).padStart(4, '0') + '.jpg';
  if (src !== lastSrc) { img.src = src; lastSrc = src; }
}
function show(el, o) { el.style.opacity = o; el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; }

window.render = function (t) {
  var intro = t < INTRO[1], inCh = t >= CH0 && t < SCHEMA[0], inSc = t >= SCHEMA[0] && t < OUTRO[0], inOut = t >= OUTRO[0];
  var card = $('card'), panel = $('panel');

  /* intro */
  var io = intro ? Math.min(prog(t, 0.2, 1.4), 1 - prog(t, INTRO[1] - 0.6, INTRO[1])) : 0;
  show($('intro'), io); $('intro').style.transform = 'translateY(' + lerp(30, 0, prog(t, 0.2, 1.4)) + 'px)';
  var ik = prog(t, 0.5, 1.8);
  show($('istage'), intro ? Math.min(ik, 1 - prog(t, INTRO[1] - 0.9, INTRO[1] - 0.2)) : 0);
  $('icard').style.transform = 'translateX(' + (lerp(160, 0, ik) * DIR) + 'px) rotateY(' + (lerp(-38, -16, ik) * DIR) + 'deg) scale(' + lerp(0.94, 1, prog(t, 0, INTRO[1])) + ')';

  /* frise */
  var stepsO = inCh ? 1 : (inSc ? 1 - prog(t, SCHEMA[0], SCHEMA[0] + 0.6) : (intro ? prog(t, INTRO[1] - 0.8, INTRO[1]) : 0));
  show($('steps'), stepsO);
  show($('note'), inOut ? 1 - prog(t, OUTRO[0], OUTRO[0] + 0.5) : 1);

  /* chapitres vidéo */
  if (inCh || (intro && t > INTRO[1] - 0.8)) {
    var i = intro ? 0 : Math.floor((t - CH0) / CH_LEN), lt = intro ? t - CH0 : (t - CH0) - i * CH_LEN;
    var seg = SEG[i], playLen = CH_LEN - 1.6, k = clamp((lt - 0.3) / playLen, 0, 1);
    setFrame(lerp(seg[0], seg[1] - 0.02, k));
    var inK = prog(lt, -0.8, 0.7), outK = (i < 4) ? prog(lt, CH_LEN - 0.55, CH_LEN) : prog(lt, CH_LEN - 0.7, CH_LEN);
    var rot = lerp(48, -7, inK) + lerp(0, 4, prog(lt, 0.7, CH_LEN - 0.6)) + lerp(0, -42, outK);
    var tx = lerp(-260, 0, inK) + lerp(0, 120, outK);
    var sc = lerp(1, 1.035, prog(lt, 0, CH_LEN));
    card.style.transform = 'translateX(' + (tx * DIR) + 'px) rotateY(' + (rot * DIR) + 'deg) scale(' + sc + ')';
    show(card, Math.min(inK, 1 - outK));
    // panneau texte
    var c = D.ch[i];
    $('num').textContent = String(i + 1).padStart(2, '0');
    $('kick').textContent = D.step + ' ' + (i + 1) + ' ' + D.of + ' 5';
    $('title').textContent = c[0];
    var lis = $('bul').children;
    for (var j = 0; j < 3; j++) {
      lis[j].textContent = c[1][j];
      var a = prog(lt, 0.9 + j * 0.45, 1.5 + j * 0.45);
      lis[j].style.opacity = Math.min(a, 1 - outK); lis[j].style.transform = 'translateY(' + lerp(16, 0, a) + 'px)';
    }
    var pk = prog(lt, 0.2, 0.9);
    show(panel, Math.min(pk, 1 - outK)); panel.style.transform = 'translateX(' + (lerp(40, 0, pk) * DIR) + 'px)';
    $('steps').querySelectorAll('.step').forEach(function (s, n) { s.className = 'step' + (n === i ? ' on' : (n < i ? ' done' : '')); });
  } else { show(card, 0); show(panel, 0); }

  /* schéma 3D */
  if (inSc) {
    var st = t - SCHEMA[0], so = Math.min(prog(st, 0, 0.8), 1 - prog(st, 14.2, 15));
    show($('schema'), so);
    var rz = lerp(-38, -22, prog(st, 0, 15)) * DIR, rx = lerp(62, 57, prog(st, 0, 15));
    world.style.transform = 'scale3d(1.3,1.3,1.3) rotateX(' + rx + 'deg) rotateZ(' + rz + 'deg)';
    var A = { plot: [0.3, 1.3], road: [0.3, 1.3], b2: [1.6, 2.8], b1: [2.6, 3.8], dec: [4.0, 5.0], rdc: [5.0, 6.4], r1: [6.6, 8.0], h: [8.4, 9.4], foot: [9.6, 10.6], ave: [0.8, 1.8] };
    var rise = function (key, el) { var a = prog(st, A[key][0], A[key][1]); el.style.opacity = a; return a; };
    rise('plot', parts.plot); rise('road', parts.road);
    ['b2', 'b1', 'rdc', 'r1'].forEach(function (k) {
      var a = rise(k, parts[k]); var base = parts[k].dataset.base || '';
      parts[k].style.transform = 'translateZ(' + lerp(k[0] === 'b' ? -60 : 70, 0, a) + 'px)';
    });
    var dimA = prog(st, A.h[0], A.h[1]); parts.dim.style.opacity = dimA;
    parts.dim.style.transform = 'translate(' + (BW / 2 + 40) + 'px,' + (BD / 2 + 40) + 'px) scaleZ(' + Math.max(dimA, 0.001) + ')';
    // étiquettes positionnées sur leurs ancres 3D
    Object.keys(labelEls).forEach(function (k) {
      var el = labelEls[k], r = anchors[k].getBoundingClientRect();
      var a = prog(st, A[k][0] + 0.4, A[k][1] + 0.4);
      el.style.left = r.left + 'px'; el.style.top = r.top + 'px'; el.style.opacity = Math.min(a, so);
    });
    var lis2 = $('legend').children, LT = [0.6, 1.9, 4.2, 5.4, 7.0, 8.8, 10.0];
    for (var m = 0; m < lis2.length; m++) { var b = prog(st, LT[m], LT[m] + 0.6); lis2[m].style.opacity = b; lis2[m].style.transform = 'translateY(' + lerp(14, 0, b) + 'px)'; }
    $('sPanel').style.opacity = prog(st, 0.2, 1);
  } else { show($('schema'), 0); Object.keys(labelEls).forEach(function (k) { labelEls[k].style.opacity = 0; }); }

  /* fin */
  if (inOut) {
    var ot = t - OUTRO[0], oo = Math.min(prog(ot, 0.2, 1.2), 1 - prog(ot, 5.8, 6.5));
    show($('outro'), oo); $('outro').style.transform = 'translateY(' + lerp(24, 0, prog(ot, 0.2, 1.2)) + 'px)';
    $('stats').querySelectorAll('.stat').forEach(function (s, n) { s.style.opacity = prog(ot, 0.9 + n * 0.25, 1.5 + n * 0.25); });
  } else show($('outro'), 0);

  return img.complete ? Promise.resolve() : img.decode().catch(function () {});
};
$('iimg').src = 'file://' + FR + '/f1050.jpg';
render(0);
</script>
